name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  lint-and-test:
    name: ruff + pytest (py3.11, CPU, no downloads)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CPU-only torch
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision

      - name: Install the package + dev extras
        run: pip install -e ".[dev]"

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      - name: pytest (unit tests only, coverage on)
        run: pytest -q -m "not slow" --cov=aerial_vit --cov-report=term-missing

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: .coverage
          if-no-files-found: ignore

  smoke-pipeline:
    name: end-to-end smoke (synthetic data, 1 epoch)
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CPU-only torch
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision

      - name: Install the package
        run: pip install -e ".[dev]"

      # Proves the pipeline executes end to end without downloading any weights:
      # the synthetic generator stands in for the Semantic Drone Dataset and the
      # `tiny` preset stands in for facebook/dinov2-small.
      - name: Fetch / generate data
        run: python scripts/fetch_data.py --config configs/smoke.yaml

      - name: Train one epoch
        run: aerialvit train --config configs/smoke.yaml --mode linear --epochs 1 --no-pretrained --set backbone.name=tiny --run-name ci_smoke

      - name: Evaluate and export
        run: |
          aerialvit eval --config configs/smoke.yaml --run-name ci_smoke --set backbone.name=tiny
          aerialvit export --config configs/smoke.yaml --run-name ci_smoke --set backbone.name=tiny

      - name: Assert the artifacts exist and are non-empty
        run: |
          python - <<'PY'
          import json, pathlib
          m = json.loads(pathlib.Path("artifacts/data_manifest.json").read_text())
          assert m["source"] == "synthetic", m["source"]
          assert m["n_train"] > 0 and m["per_class_pixels"]
          e = json.loads(pathlib.Path("artifacts/results/ci_smoke_eval.json").read_text())
          assert 0.0 <= e["miou"] <= 1.0
          assert e["landing_zone_iou"] is not None
          x = json.loads(next(pathlib.Path("artifacts/results").glob("export_ci_smoke.json")).read_text())
          assert x["onnx"]["passed"], x["onnx"]
          print("smoke pipeline OK:", e["miou"], e["landing_zone_iou"])
          PY

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-artifacts
          path: artifacts/results/*.json
          if-no-files-found: ignore
