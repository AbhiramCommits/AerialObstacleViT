# Shared defaults for every AerialObstacleViT run.
# smoke.yaml / full.yaml / ablate.yaml inherit from this via `defaults: base`.

run:
  name: base
  out_dir: artifacts
  device: auto        # auto -> cuda > mps > cpu
  seed: 1337
  deterministic: true
  tags: []

data:
  source: auto        # auto | semantic_drone | synthetic
  src: null           # URL or local path for Semantic Drone Dataset
  root: null          # null -> $AERIALVIT_DATA_DIR or artifacts/data
  image_size: 224
  classes:
    - background
    - paved-area
    - grass
    - roof
    - tree
    - water
    - person
    - vehicle
  landable_classes: [paved-area, grass]
  n_train: 64
  n_val: 16
  n_test: 16
  rare_pixel_threshold: 0.01
  rare_instance_threshold: 50
  augment: true
  num_workers: 0
  synthetic:
    n_scenes: 24
    base_size: 384
    min_objects: 12
    max_objects: 26
    glare_prob: 0.25
    blur_prob: 0.25
    haze_prob: 0.25
    altitude_scales: [0.7, 1.0, 1.4]
    altitude_shift_prob: 0.5
    texture: 0.18
    seed: 1337

backbone:
  family: dinov2
  name: facebook/dinov2-small
  patch_size: 14
  freeze: true

model:
  seg_head: linear      # linear (probe) | conv (decoder)
  head_dim: 256
  conv_layers: 2
  box_head: true
  box_head_dim: 128
  dropout: 0.1
  box_strides: [1, 2]

train:
  mode: linear          # linear | lora | full
  epochs: 2
  batch_size: 4
  lr: 0.001
  backbone_lr: 0.00001
  weight_decay: 0.05
  warmup_frac: 0.05
  label_smoothing: 0.0
  amp: true
  grad_clip: 1.0
  dice_weight: 1.0
  focal_weight: 1.0
  focal_alpha: 0.25
  focal_gamma: 2.0
  bbox_weight: 1.0
  giou_weight: 0.5
  obj_weight: 1.0
  early_stop_patience: 10
  max_steps: 0
  log_every: 10
  label_fraction: 1.0
  lora_rank: 8
  lora_alpha: 16
  lora_dropout: 0.0
  lora_targets: [q_proj, k_proj, v_proj, o_proj, query, key, value, dense]
  lora_impl: native

eval:
  batch_size: 4
  score_thresh: 0.05
  nms_iou: 0.5
  max_dets: 100
  top_k_hard: 24
  mc_dropout_samples: 8
  cluster_k_range: [2, 6]

ablation:
  modes: [linear, lora_r4, lora_r16, full]
  label_fractions: [0.01, 0.05, 0.1, 0.25, 1.0]
  seeds: [1337, 2024]
  multiseed_max_fraction: 0.25
  max_steps: 0
