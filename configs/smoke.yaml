# Tiny end-to-end config: finishes in minutes on a laptop CPU.
# Used by CI, the smoke job, and the unit tests.
defaults: base

run:
  name: smoke
  tags: [smoke]

data:
  n_train: 24
  n_val: 8
  n_test: 8
  synthetic:
    n_scenes: 12
    base_size: 320
    min_objects: 8
    max_objects: 16

model:
  seg_head: linear

train:
  mode: linear
  epochs: 2
  batch_size: 4
  lr: 0.001
  max_steps: 0

eval:
  top_k_hard: 8
  mc_dropout_samples: 4
  cluster_k_range: [2, 3]

ablation:
  modes: [linear, lora_r8, full]
  label_fractions: [0.25, 1.0]
  seeds: [1337, 2024]
  multiseed_max_fraction: 0.25
